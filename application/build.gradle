/**
 * Application 모듈
 * - REST Controller, Service (비즈니스 로직), Swagger
 * - 저장소 구현 몰라도 됨 (domain-service만 호출)
 */
bootJar {
    enabled = true
}

jar {
    enabled = false
}

dependencies {
    // 내부 모듈 의존성
    implementation project(':domain:domain-service')
    implementation project(':domain:domain-redis')
    implementation project(':clients')
    implementation project(':support')
    implementation project(':common')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Transaction
    implementation 'org.springframework:spring-tx'

    // Spring Data (Page, Pageable)
    implementation 'org.springframework.data:spring-data-commons'

    // Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Swagger (SpringDoc OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Actuator + Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Logging (JSON)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation project(':domain:domain-rdb')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TestContainers
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
//    testImplementation 'com.redis.testcontainers:testcontainers-redis:1.6.4'
}
