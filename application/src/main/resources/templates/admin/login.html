<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDGL 관리자</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            text-align: center;
            font-size: 24px;
            color: #333333;
            margin-bottom: 8px;
        }
        .login-card p {
            text-align: center;
            font-size: 14px;
            color: #888888;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555555;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #4a90d9;
        }
        .error-message {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #4a90d9;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .login-button:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>NDGL 관리자</h1>
        <p>관리자 액세스 토큰을 입력해주세요</p>

        <div th:if="${error}" class="error-message">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label for="token">액세스 토큰</label>
                <input type="password" id="token" name="token" placeholder="액세스 토큰 입력" required>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>
    </div>
</body>
</html>
