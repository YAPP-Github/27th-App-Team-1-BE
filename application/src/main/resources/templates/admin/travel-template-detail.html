<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'#' + ${highlights.travelId} + ' 상세 - NDGL 관리자'">여행 템플릿 상세</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .back-link {
            font-size: 14px;
            color: #4a90d9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .back-link:hover { text-decoration: underline; }
        .header h1 { font-size: 22px; color: #333; }
        .logout-link { font-size: 14px; color: #888; text-decoration: none; }
        .logout-link:hover { color: #cf1322; }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 하이라이트 섹션 */
        .highlight-top {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .thumbnail-wrap {
            flex-shrink: 0;
            width: 220px;
            height: 138px;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(135deg, #e8edf2, #d0d7de);
        }
        .thumbnail-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .thumbnail-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #aaa;
        }
        .highlight-info { flex: 1; }
        .program-name {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .program-name span { font-size: 15px; font-weight: 700; color: #222; }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .badge-youtube { background: #ffebeb; color: #e53e3e; }
        .badge-tv { background: #ebf8ff; color: #3182ce; }
        .video-title { font-size: 14px; color: #555; margin-bottom: 10px; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        .info-item { }
        .info-label { font-size: 11px; font-weight: 600; color: #999; margin-bottom: 2px; text-transform: uppercase; }
        .info-value { font-size: 14px; color: #333; font-weight: 500; }
        .summary-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin-top: 12px;
        }
        .link-row {
            margin-top: 12px;
        }
        .ext-link {
            font-size: 13px;
            color: #4a90d9;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .ext-link:hover { text-decoration: underline; }
        /* 일정 */
        .day-group { margin-bottom: 20px; }
        .day-title {
            font-size: 15px;
            font-weight: 700;
            color: #4a90d9;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #f0f7ff;
            border-radius: 6px;
            display: inline-block;
        }
        .place-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .place-row:last-child { border-bottom: none; }
        .seq-badge {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #4a90d9;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }
        .place-thumb {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            background: #e8edf2;
        }
        .place-thumb-placeholder {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e8edf2, #d0d7de);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .place-info { flex: 1; }
        .place-name { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 4px; }
        .place-category {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 99px;
            background: #f0f0f0;
            color: #666;
            display: inline-block;
            margin-bottom: 6px;
        }
        .place-meta { font-size: 12px; color: #999; margin-bottom: 4px; }
        .place-meta span { margin-right: 12px; }
        .place-tips {
            font-size: 12px;
            color: #555;
            background: #fffbe6;
            border-left: 3px solid #ffd666;
            padding: 6px 10px;
            border-radius: 0 4px 4px 0;
            margin-top: 6px;
        }
        .transport-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .transport-chip {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 99px;
            background: #e8f4fd;
            color: #1a73e8;
            font-weight: 500;
        }
        .planb-list { font-size: 12px; color: #888; margin-top: 4px; }
        .maps-link {
            font-size: 12px;
            color: #4a90d9;
            text-decoration: none;
        }
        .maps-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="/admin/travel-templates" class="back-link">← 목록으로</a>
                <h1 th:text="'여행 템플릿 #' + ${highlights.travelId}">여행 템플릿 상세</h1>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <a href="/admin/travel-templates/new" style="font-size:14px; color:#4a90d9; text-decoration:none; font-weight:500;">+ 새 템플릿 등록</a>
                <form th:action="@{/admin/travel-templates/{id}/delete(id=${highlights.travelId})}" method="POST"
                      onsubmit="return confirm('정말 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')">
                    <button type="submit"
                            style="padding:8px 16px; background:#fff2f0; color:#cf1322; border:1px solid #ffccc7; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
                        템플릿 삭제
                    </button>
                </form>
                <form action="/admin/logout" method="POST" style="margin:0;">
                    <button type="submit" class="logout-link" style="background:none; border:none; cursor:pointer; padding:0;">로그아웃</button>
                </form>
            </div>
        </div>

        <!-- 하이라이트 -->
        <div class="card">
            <h2>📋 기본 정보</h2>
            <div class="highlight-top">
                <div class="thumbnail-wrap">
                    <img th:if="${highlights.program.thumbnail != null and not #strings.isEmpty(highlights.program.thumbnail)}"
                         th:src="${highlights.program.thumbnail}" alt="썸네일"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="thumbnail-placeholder"
                         th:style="${highlights.program.thumbnail != null and not #strings.isEmpty(highlights.program.thumbnail)} ? 'display:none' : 'display:flex'">
                        🎬
                    </div>
                </div>
                <div class="highlight-info">
                    <div class="program-name">
                        <span th:text="${highlights.program.name}"></span>
                    </div>
                    <div class="video-title" th:text="${highlights.program.title}"></div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">국가</div>
                            <div class="info-value"
                                 th:text="${highlights.countryName ?: highlights.country} + ' (' + ${highlights.country} + ')'"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">도시</div>
                            <div class="info-value" th:text="${highlights.city}"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">일정</div>
                            <div class="info-value" th:text="${highlights.nights} + '박 ' + ${highlights.days} + '일'"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">1인 예산</div>
                            <div class="info-value"
                                 th:text="${highlights.budgetPerPerson != null} ? ${#numbers.formatInteger(highlights.budgetPerPerson, 3, 'COMMA')} + '원' : '-'"></div>
                        </div>
                    </div>
                    <div class="link-row" th:if="${highlights.program.link != null and not #strings.isEmpty(highlights.program.link)}">
                        <a th:href="${highlights.program.link}" target="_blank" class="ext-link">▶ 영상 보기</a>
                    </div>
                </div>
            </div>
            <div class="summary-box" th:if="${highlights.program.summary != null}"
                 th:text="${highlights.program.summary}"></div>
        </div>

        <!-- 일정 -->
        <div class="card">
            <h2>🗺️ 여행 일정</h2>

            <div th:if="${groupedItinerary == null or #maps.isEmpty(groupedItinerary)}"
                 style="text-align:center; padding:40px 0; color:#aaa;">
                등록된 일정이 없습니다.
            </div>

            <div th:each="entry : ${groupedItinerary}" class="day-group">
                <div class="day-title" th:text="${entry.key} + '일차'"></div>

                <div th:each="place : ${entry.value}" class="place-row">
                    <div class="seq-badge" th:text="${place.sequence}"></div>

                    <!-- 장소 썸네일 -->
                    <img th:if="${place.place != null and place.place.thumbnail != null and not #strings.isEmpty(place.place.thumbnail)}"
                         th:src="${place.place.thumbnail}"
                         class="place-thumb" alt="장소 사진"
                         onerror="this.style.display='none';">
                    <div th:if="${place.place == null or place.place.thumbnail == null or #strings.isEmpty(place.place.thumbnail)}"
                         class="place-thumb-placeholder">📍</div>

                    <div class="place-info">
                        <div class="place-name"
                             th:text="${place.place != null ? place.place.name : '(장소 정보 없음)'}"></div>

                        <span th:if="${place.place != null and place.place.category != null}"
                              class="place-category"
                              th:text="${place.place.category}"></span>

                        <div class="place-meta">
                            <span th:if="${place.estimatedDuration != null}"
                                  th:text="'⏱ ' + ${place.estimatedDuration} + '분'"></span>
                            <span th:if="${place.distanceKm != null}"
                                  th:text="'📏 ' + ${place.distanceKm} + 'km'"></span>
                            <span th:if="${place.place != null and place.place.regularOpeningHours != null}"
                                  th:text="'🕐 ' + ${place.place.regularOpeningHours}"></span>
                            <a th:if="${place.place != null and place.place.googleMapsUri != null}"
                               th:href="${place.place.googleMapsUri}"
                               target="_blank" class="maps-link">🗺 지도 보기</a>
                        </div>

                        <!-- 교통수단 -->
                        <div th:if="${place.transportation != null and not #lists.isEmpty(place.transportation)}"
                             class="transport-chips">
                            <span th:each="t : ${place.transportation}"
                                  class="transport-chip"
                                  th:text="${t.mode} + (${t.timeMin != null} ? ' ' + ${t.timeMin} + '분' : '')"></span>
                        </div>

                        <!-- 팁 -->
                        <div th:if="${place.travelerTips != null and not #lists.isEmpty(place.travelerTips)}"
                             class="place-tips">
                            <span th:each="tip, iterStat : ${place.travelerTips}">
                                <span th:text="'💡 ' + ${tip}"></span>
                                <br th:if="${!iterStat.last}">
                            </span>
                        </div>

                        <!-- PlanB -->
                        <div th:if="${place.planB != null and not #lists.isEmpty(place.planB)}"
                             class="planb-list">
                            대안:
                            <span th:each="pb, iterStat : ${place.planB}">
                                <span th:text="${pb.name}"></span><span th:if="${!iterStat.last}">, </span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
